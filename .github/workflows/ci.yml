name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest   # the oldest supported Python; Windows-only tests are skipped here
            python: "3.11"
          - os: windows-latest  # runs the tests that call the real wevtutil, GlobalMemoryStatusEx and PowerShell
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q
